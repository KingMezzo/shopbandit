name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell scripts
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native SQLite build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: ../tools/fetch-sqlite.sh
      - run: flutter pub get
      - run: python3 ../tools/generate-categories.py --check
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Real PocketBase two-device sync and realtime
        run: |
          docker build -t shopbandit-server:app-test ../server
          docker run -d --name pb-app-test -p 127.0.0.1:18090:8090 shopbandit-server:app-test
          for attempt in $(seq 1 30); do
            echo "PocketBase readiness attempt $attempt/30"
            curl -sf http://127.0.0.1:18090/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/api/health
          flutter test test/pocketbase_sync_integration_test.dart --dart-define=SHOPBANDIT_TEST_URL=http://127.0.0.1:18090
      - name: App integration server logs
        if: failure()
        run: docker logs pb-app-test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable app test server
        if: always()
        run: docker rm -f pb-app-test || true

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build server image
        run: docker build -t shopbandit-server:ci server
      - name: Start PocketBase
        run: |
          docker run -d --name pb -p 127.0.0.1:8090:8090 \
            -v "$PWD/server/scripts/test_hooks/stale_categories.pb.js:/pb/pb_hooks/stale_categories.pb.js:ro" \
            shopbandit-server:ci
          for attempt in $(seq 1 30); do
            echo "PocketBase readiness attempt $attempt/30"
            curl -sf http://127.0.0.1:8090/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/api/health
      - name: Integration smoke test
        run: server/scripts/smoke-test.sh http://127.0.0.1:8090
      - name: Category API and household isolation tests
        run: python3 server/scripts/category-test.py http://127.0.0.1:8090 --stale-snapshot-tests
      - name: Filled v1 database copy upgrade and restart
        run: python3 server/scripts/test-category-upgrade.py --image shopbandit-server:ci
      - name: Logs
        if: failure()
        run: docker logs pb
      - name: Stop disposable server
        if: always()
        run: docker rm -f pb || true
