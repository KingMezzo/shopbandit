name: Server image

on:
  pull_request:
    paths: ['server/**', '.github/workflows/server-image.yml']
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: ''
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    if: ${{ inputs.publish && github.repository == 'KingMezzo/shopbandit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and caller tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python3 tools/check-release-version.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          # Exact version only; neither test nor stable builds move latest.
          tags: ghcr.io/kingmezzo/shopbandit-server:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/KingMezzo/shopbandit
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
