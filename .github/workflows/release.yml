name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.repository == 'KingMezzo/shopbandit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        run: python3 tools/check-release-version.py

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  apk:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: bash ../tools/fetch-sqlite.sh
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Build and verify signed APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOPBANDIT_KEYSTORE_BASE64 }}
          SHOPBANDIT_KEYSTORE: ${{ runner.temp }}/release.jks
          SHOPBANDIT_KEYSTORE_PASSWORD: ${{ secrets.SHOPBANDIT_KEYSTORE_PASSWORD }}
          SHOPBANDIT_KEY_ALIAS: ${{ secrets.SHOPBANDIT_KEY_ALIAS }}
          SHOPBANDIT_KEY_PASSWORD: ${{ secrets.SHOPBANDIT_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          : "${KEYSTORE_BASE64:?Missing SHOPBANDIT_KEYSTORE_BASE64}"
          : "${SHOPBANDIT_KEYSTORE_PASSWORD:?Missing SHOPBANDIT_KEYSTORE_PASSWORD}"
          : "${SHOPBANDIT_KEY_ALIAS:?Missing SHOPBANDIT_KEY_ALIAS}"
          : "${SHOPBANDIT_KEY_PASSWORD:?Missing SHOPBANDIT_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SHOPBANDIT_KEYSTORE"
          keytool -list -keystore "$SHOPBANDIT_KEYSTORE" -storepass:env SHOPBANDIT_KEYSTORE_PASSWORD -alias "$SHOPBANDIT_KEY_ALIAS" > /dev/null
          flutter build apk --release --split-per-abi --build-name="$RELEASE_VERSION"
          flutter build apk --release --build-name="$RELEASE_VERSION"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          mkdir -p ../dist
          count=0
          for f in build/app/outputs/flutter-apk/app-*release.apk; do
            "$apksigner" verify "$f"
            n=$(basename "$f")
            cp "$f" "../dist/shopbandit-$RELEASE_VERSION${n#app}"
            count=$((count + 1))
          done
          test "$count" -eq 4
          (cd ../dist && sha256sum ./*.apk > SHA256SUMS)
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [version, checks, apk]
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, apk, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apks
          path: dist
      - name: Include versioned server image and immutable digest
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf 'ghcr.io/kingmezzo/shopbandit-server:%s\nghcr.io/kingmezzo/shopbandit-server@%s\n' "$RELEASE_VERSION" "$IMAGE_DIGEST" > dist/SERVER_IMAGE.txt
          (cd dist && sha256sum ./*.apk SERVER_IMAGE.txt > SHA256SUMS)
          printf 'ShopBandit %s\n\nServer image: ghcr.io/kingmezzo/shopbandit-server:%s\nPlatforms: linux/amd64, linux/arm64.\n\nUpdate the server before Android. No deployment is performed by this release.\n' "$RELEASE_VERSION" "$RELEASE_VERSION" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          repository: KingMezzo/shopbandit
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: 'false'
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/SERVER_IMAGE.txt
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo KingMezzo/shopbandit --draft=false --latest=false
